services:
  plankan_app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APP_URL=https://budget.twogether.click
    container_name: plankan-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - MINIO_ENDPOINT=plankan-minio
      - "RECEIPT_TMP_DIR=/tmp/plankan-receipts"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - proxy
      - sjo_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.plankan.entrypoints=websecure"
      - "traefik.http.routers.plankan.rule=Host(`budget.twogether.click`)"
      - "traefik.http.routers.plankan.tls=true"
      - "traefik.http.routers.plankan.tls.certresolver=letsencrypt"
      - "traefik.http.services.plankan.loadbalancer.server.port=3000"

  minio:
    image: minio/minio:latest
    container_name: plankan-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.rule=Host(`minio.twogether.click`)"
      - "traefik.http.routers.minio-console.tls=true"
      - "traefik.http.routers.minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

networks:
  proxy:
    external: true
  sjo_default:
    external: true

volumes:
  minio-data:
    external: true
